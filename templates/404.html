{% extends "base.html" %}

{% block title %}404 Not Found - Sales Data Analysis System{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 2rem;">
    <h1 style="font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1;">404</h1>
    <h2 style="font-size: 1.5rem; margin-top: 1rem; margin-bottom: 0.5rem;">Oops! Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
        The page you are looking for does not exist or has been moved.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
        Return to Home
    </a>
</div>
{% endblock %}
